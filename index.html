<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Activity Presentation</title>
<style>
:root{--bg1:#dce8ff;--bg2:#ffe2f0;--bg3:#d6f8e8;--fg:#0b1226;--fg2:rgba(11,18,38,.6);--g:rgba(255,255,255,.5);--gb:rgba(255,255,255,.75);--acc:#0a84ff;--chip:rgba(255,255,255,.55);--sh:rgba(30,50,100,.16);color-scheme:light}
[data-theme=dark]{--bg1:#0a1030;--bg2:#2b1148;--bg3:#04303a;--fg:#f5f7ff;--fg2:rgba(245,247,255,.62);--g:rgba(32,36,62,.45);--gb:rgba(255,255,255,.18);--acc:#4da3ff;--chip:rgba(255,255,255,.1);--sh:rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg1);overflow:hidden;transition:background .4s,color .4s}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;background:radial-gradient(40% 40% at 15% 20%,var(--bg2),transparent 70%),radial-gradient(45% 45% at 85% 25%,var(--bg3),transparent 70%),radial-gradient(50% 50% at 50% 95%,color-mix(in srgb,var(--acc) 35%,transparent),transparent 70%)}
.glass{background:var(--g);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);border:1px solid var(--gb);box-shadow:inset 0 1.5px 0 var(--gb),inset 0 -1px 0 rgba(255,255,255,.06),0 14px 44px var(--sh)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom)) 74px}
/* menu button */
#menu{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;width:48px;height:48px;border-radius:50%;z-index:30;display:grid;place-items:center;transition:transform .3s}
#menu:active{transform:scale(.92)}
#menu i{position:absolute;width:20px;height:2.5px;border-radius:2px;background:var(--fg);transition:transform .45s cubic-bezier(.7,0,.2,1),opacity .25s}
#menu i:nth-child(1){transform:translateY(-6.5px)}#menu i:nth-child(3){transform:translateY(6.5px)}
body.open #menu i:nth-child(1){transform:rotate(45deg)}body.open #menu i:nth-child(2){opacity:0;transform:scaleX(0)}body.open #menu i:nth-child(3){transform:rotate(-45deg)}
/* sidebar */
#scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .4s}
body.open #scrim{opacity:1;pointer-events:auto}
#side{position:fixed;top:10px;left:10px;bottom:10px;width:min(360px,calc(100vw - 20px));z-index:25;border-radius:34px;padding:76px 20px 22px;overflow-y:auto;transform:translateX(calc(-100% - 20px)) scale(.96);opacity:0;transform-origin:left top;transition:transform .55s cubic-bezier(.2,.9,.25,1),opacity .35s;visibility:hidden}
body.open #side{transform:none;opacity:1;visibility:visible}
#side h2{font-size:13px;font-weight:600;color:var(--fg2);margin:20px 4px 8px}
#side h2:first-of-type{margin-top:0}
.grp{border-radius:20px;background:var(--chip);padding:4px 14px}
.row{display:grid;gap:4px;padding:10px 0;border-bottom:1px solid var(--gb)}.row:last-child{border:0}
.row label{font-size:12px;color:var(--fg2)}
.row input{background:none;border:0;outline:0;font-size:15px;width:100%;padding:2px 0}
.seg{display:flex;padding:3px;border-radius:14px;background:var(--chip);gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:11px;font-size:14px;transition:background .25s,box-shadow .25s}
.seg button.on{background:var(--gb);box-shadow:0 2px 8px var(--sh);font-weight:600}
.btn{display:block;width:100%;padding:13px;border-radius:16px;background:var(--chip);font-weight:600;font-size:15px;margin-top:8px;text-align:center;transition:transform .2s}
.btn:active{transform:scale(.97)}.btn.pri{background:var(--acc);color:#fff}
small.n{display:block;font-size:12px;color:var(--fg2);margin:6px 6px 0;line-height:1.4}
/* top bar */
.top{display:flex;align-items:center;gap:10px;min-width:0}
.pill{border-radius:999px;padding:5px;display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.pill::-webkit-scrollbar{display:none}
.pill button,.pill select{padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;transition:background .3s,color .3s,box-shadow .3s}
.pill select{appearance:none;background:none;border:0;font-weight:600;padding-right:14px}
.pill button.on{background:var(--acc);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 45%,transparent)}
.ttl{margin-left:auto;text-align:right;font-size:13px;color:var(--fg2);white-space:nowrap}
/* stage */
.wrap{display:grid;place-items:center;min-height:0}
.stage{container-type:size;aspect-ratio:16/9;width:min(100%,calc((100dvh - 190px)*16/9));border-radius:clamp(22px,3.4cqw,40px);position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:5cqw 6cqw;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateX(5cqw) scale(.985);transition:opacity .55s,transform .65s cubic-bezier(.2,.9,.25,1)}
.slide.on{opacity:1;transform:none;pointer-events:auto}.slide.before{transform:translateX(-5cqw) scale(.985)}
.cover{justify-content:center}
.cover h1{font-size:11cqw;line-height:1;font-weight:700;letter-spacing:-.035em}
.cover p{font-size:2.8cqw;color:var(--fg2);margin-top:1.6cqw}
.who{margin-top:auto;font-size:2.2cqw}.who b{display:block;font-size:2.8cqw}.who span{color:var(--fg2)}
.day{display:grid;grid-template-columns:34% 1fr;gap:4cqw}
.day .l{display:flex;flex-direction:column;justify-content:center}
.day h2{font-size:6.2cqw;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.day .d{font-size:2.3cqw;color:var(--fg2);margin-top:1cqw}
.day .s{font-size:1.9cqw;margin-top:2.4cqw;line-height:1.4}
.items{display:flex;flex-direction:column;gap:1.1cqw;justify-content:center;overflow:auto;padding:.5cqw 0;scrollbar-width:none}
.it{background:var(--chip);border:1px solid var(--gb);border-radius:2cqw;padding:1.4cqw 2cqw;font-size:2.3cqw;line-height:1.3;box-shadow:inset 0 1px 0 var(--gb)}
.items.many .it{font-size:1.8cqw;padding:1cqw 1.6cqw}
.empty{color:var(--fg2);font-size:2.4cqw;text-align:center}
.sum h2{font-size:4.4cqw;font-weight:700;letter-spacing:-.02em}
.stats{display:flex;gap:2cqw;margin:2cqw 0}
.stats div{background:var(--chip);border:1px solid var(--gb);border-radius:2cqw;padding:1.4cqw 2.4cqw;font-size:1.8cqw;color:var(--fg2)}
.stats b{display:block;font-size:4cqw;color:var(--fg)}
.sl{display:grid;gap:1cqw;font-size:1.9cqw;line-height:1.35;overflow:auto}
.sl p b{display:inline-block;width:11cqw}
.msg{margin:auto;text-align:center;font-size:2.4cqw;color:var(--fg2);max-width:70cqw;line-height:1.5}
/* controls */
.ctl{justify-self:center;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px}
.ctl button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;transition:background .2s,transform .2s}
.ctl button:active{transform:scale(.88)}.ctl button:hover{background:var(--chip)}.ctl button:disabled{opacity:.3}
.dots{display:flex;gap:7px;padding:0 10px}.dots i{width:8px;height:8px;border-radius:99px;background:var(--fg2);opacity:.4;transition:all .4s cubic-bezier(.2,.9,.25,1)}.dots i.on{width:24px;opacity:1;background:var(--acc)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);padding:12px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.4s;z-index:40;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){.ttl{display:none}.app{padding-left:14px;padding-top:74px}.top{overflow:hidden}.day{grid-template-columns:1fr;gap:1.5cqw}.day h2{font-size:7cqw}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}

.day{display:grid;grid-template-columns:30% 1fr;gap:3.5cqw;padding:4cqw 5cqw}
.day .m{display:flex;gap:.8cqw;margin-top:1.2cqw;flex-wrap:wrap}
.day .m span,.cat{background:var(--acc);color:#fff;border-radius:99px;padding:.3cqw 1.2cqw;font-size:1.4cqw;font-weight:600;display:inline-block}
.day .m span{background:var(--chip);color:var(--fg);border:1px solid var(--gb)}
.day .s{font-size:1.7cqw;color:var(--fg2)}
.it{display:grid;grid-template-columns:1fr auto;gap:.8cqw 1.5cqw;font-size:1.6cqw;padding:1.1cqw 1.6cqw;border-radius:1.8cqw;flex:none}
.it .t{font-weight:600;font-size:1.9cqw;grid-column:1}
.it .f{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw;grid-column:1}
.it label{display:block;font-size:1.2cqw;color:var(--fg2)}
.it p{min-height:2cqw;outline:0;border-bottom:1px dashed var(--gb);line-height:1.3}
.it p:empty::before{content:attr(data-ph);color:var(--fg2);opacity:.55}
.it .ph{grid-column:2;grid-row:1/4;display:flex;flex-wrap:wrap;gap:.6cqw;max-width:17cqw;justify-content:flex-end;align-content:flex-start}
.pi{width:8cqw;height:6cqw;object-fit:cover;border-radius:1.2cqw;cursor:zoom-in}
.ex{flex:none;font-size:1.3cqw;color:var(--fg2)}.ex .ph{display:flex;gap:.6cqw;margin-top:.5cqw}
.nar{font-size:2cqw;line-height:1.45}
.cats{display:flex;gap:1cqw;flex-wrap:wrap;margin:1.2cqw 0}
.sum .sl{font-size:1.7cqw}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:none;place-items:center}#lb.on{display:grid}#lb img{max-width:92vw;max-height:92vh;border-radius:18px}
@media(max-width:640px){.day{grid-template-columns:1fr}}

.evs h2{font-size:3.4cqw;font-weight:700;letter-spacing:-.02em;margin-bottom:1.6cqw}
.gal{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:1.4cqw;flex:1;min-height:0}
.gal figure{display:flex;flex-direction:column;min-height:0;gap:.5cqw}
.gal .gi{width:100%;flex:1;min-height:0;height:auto;border-radius:1.6cqw}
.gal figcaption{font-size:1.3cqw;color:var(--fg2);line-height:1.25;max-height:3.4cqw;overflow:hidden}.gal figcaption b{display:block;color:var(--fg)}
</style>
</head>
<body>
<button id="menu" class="glass" aria-label="Buka menu" aria-expanded="false"><i></i><i></i><i></i></button>
<div id="scrim"></div>

<aside id="side" class="glass" aria-label="Sidebar">
  <h2>Preferences</h2>
  <div class="grp">
    <div class="row"><label for="pName">Nama trainer</label><input id="pName" autocomplete="off"></div>
    <div class="row"><label for="pTitle">Jabatan</label><input id="pTitle" autocomplete="off"></div>
  </div>
  <h2>Appearance</h2>
  <div class="seg" id="theme"><button data-v="system">Perangkat</button><button data-v="light">Terang</button><button data-v="dark">Gelap</button></div>
  <h2>Sumber data</h2>
  <div class="grp">
    <div class="row"><label for="pSheet">Link Google Sheet</label><input id="pSheet" autocomplete="off"></div>
    <div class="row"><label for="pYear">Tahun</label><input id="pYear" type="number" min="2000" max="2100"></div>
    <div class="row"><label for="pTab">Pola nama tab bulan</label><input id="pTab" placeholder="{Month}" autocomplete="off"></div>
    <div class="row"><label for="pScript">URL Apps Script (data dan foto)</label><input id="pScript" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"></div>
  </div>
  <small class="n">Pola: {Month} = January, {Mon} = Jan, {MM} = 01. Jika tidak cocok, app mencoba nama umum lain otomatis. Sheet harus dibagikan "Anyone with the link".</small>
  <button class="btn pri" id="reload">Simpan dan muat ulang data</button>
  <label class="btn" style="cursor:pointer">Impor CSV bulan ini<input id="csvIn" type="file" accept=".csv,text/csv" hidden></label>
  <h2>Export week ini</h2>
  <button class="btn" id="exPptx">Export .pptx (PowerPoint)</button>
  <button class="btn" id="exKey">Export .key (Keynote)</button>
</aside>

<main class="app">
  <div class="top">
    <div class="pill glass"><select id="month" aria-label="Bulan"></select></div>
    <div class="pill glass" id="weeks" role="tablist"></div>
    <div class="ttl" id="who"></div>
  </div>
  <div class="wrap"><div class="stage glass" id="stage"></div></div>
  <div class="ctl glass">
    <button id="prev" aria-label="Slide sebelumnya">&#8249;</button>
    <div class="dots" id="dots"></div>
    <button id="next" aria-label="Slide berikutnya">&#8250;</button>
    <button id="fs" aria-label="Layar penuh" style="font-size:16px">&#x26F6;</button>
  </div>
</main>
<div id="lb"><img alt="Foto evidence"></div>
<div id="toast" class="glass"></div>

<script>
const $=s=>document.querySelector(s);
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MI=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DY=['Senin','Selasa','Rabu','Kamis','Jumat'];
const DEF={sheet:'https://docs.google.com/spreadsheets/d/1EC0f0uUNcu7JJfsGaIZygnbZcza7025r_gnlquH8LrI/edit?usp=sharing',year:new Date().getFullYear(),tab:'{Month}',script:'',name:'Frandy Putra',title:'Executive Trainer',theme:'system'};
let S={...DEF};try{Object.assign(S,JSON.parse(localStorage.getItem('wp-settings')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('wp-settings',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=new Date();let M=now.getMonth(),W=0,I=0,slides=[],cache={},weeks=[];

/* ---------- theme ---------- */
const mq=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){document.documentElement.dataset.theme=S.theme==='system'?(mq.matches?'dark':'light'):S.theme;
  document.querySelectorAll('#theme button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.theme))}
mq.addEventListener('change',applyTheme);

/* ---------- data ---------- */
function csv(t){const r=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'){row.push(f);r.push(row);row=[];f=''}else if(c!='\r')f+=c}
  row.push(f);r.push(row);return r}
const isD=v=>/^\d{1,2}$/.test((v||'').trim())&&+v>=1&&+v<=31;
const junk=/^(mon|tue|wed|thu|fri|sat|sun|sen|sel|rab|kam|jum|sab|min)\w*$|^[mtwfsrk]$/i;
const isMonth=x=>MN.some(m=>m.toLowerCase()===x.trim().toLowerCase())||MI.some(m=>m.toLowerCase()===x.trim().toLowerCase());
let dirty=false,evFor=null,EVSTAT={rows:0,miss:0,err:'',why:''};const EV={};let EDIT={};try{EDIT=JSON.parse(localStorage.getItem('wp-edits')||'{}')}catch(e){}
const CATS=[[/off\s?day|libur|cuti/i,'Off Day'],[/interview|rekrut/i,'Rekrutmen'],[/visit|kunjungan/i,'Store Visit'],[/meeting|rapat|briefing/i,'Meeting'],[/monitor|check|cek|audit/i,'Monitoring'],[/training|pelatihan|coaching|role ?play/i,'Training'],[/reminder|koordinasi|follow/i,'Koordinasi'],[/revisi|report|laporan|keynote|materi|presentasi|deck|slide/i,'Administrasi & Materi']];
const catOf=t=>(CATS.find(c=>c[0].test(t))||[0,'Lainnya'])[1];
/* satu sel tanggal -> daftar aktivitas. Baris "Visit Mxxx ..." = toko; baris "- ..." = aktivitas; "Catatan:/Kendala:" dan "Action Plan:/Tindak lanjut:" opsional */
function parseCell(txt){const out=[];let toko='';
  txt.split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(l=>{const b=l.replace(/^[-•*–]\s*/,'');let m;
    if(out.length&&(m=b.match(/^(?:catatan|kendala|note)s?\s*[:：]\s*(.+)/i))){out.at(-1).n=m[1];return}
    if(out.length&&(m=b.match(/^(?:action plan|tindak lanjut|follow ?up|aksi)\s*[:：]\s*(.+)/i))){out.at(-1).a=m[1];return}
    if(!/^[-•*–]/.test(l)&&(m=b.match(/^(?:visit|kunjungan)\s+(.+)/i))){toko=m[1];out.push({toko,text:b,cat:'Store Visit',n:'',a:'',head:1});return}
    out.push({toko,text:b,cat:catOf(b),n:'',a:''})});
  return out.filter((o,i)=>!o.head||!out.some((p,j)=>j!==i&&!p.head&&p.toko===o.toko))}
function extract(g){
  const dr=g.map((row,r)=>row.some(isD)?r:-1).filter(r=>r>=0),ev={};
  dr.forEach((r,i)=>{const end=dr[i+1]??g.length,row=g[r];let prev=0,wrapped=false;
    const one=i===0?row.findIndex(v=>(v||'').trim()==='1'):-1;
    row.forEach((v,c)=>{if(!isD(v))return;const d=+v;
      if(d<prev)wrapped=true;prev=d;
      if(wrapped||(i===0&&one>=0&&c<one))return;
      for(let k=r+1;k<end;k++){const x=(g[k][c]||'').trim();if(x&&!junk.test(x)&&!isMonth(x))(ev[d]=ev[d]||[]).push(...parseCell(x))}})});
  return ev}
function dayOf(v,y,m){v=String(v||'').trim();let x;if(!v)return 0;
  if(x=v.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))return +x[1]===y&&+x[2]===m+1?+x[3]:0;
  if(x=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/)){const a=+x[1],b=+x[2],yy=+x[3]<100?2000+ +x[3]:+x[3];if(yy!==y)return 0;return b===m+1?a:a===m+1?b:0}
  if(x=v.match(/(\d{1,2})\s+([A-Za-z]{3,})\s*,?\s*(\d{4})?/)){const k=x[2].slice(0,3).toLowerCase(),f=n=>n.slice(0,3).toLowerCase()===k;return(MN.findIndex(f)===m||MI.findIndex(f)===m)&&(!x[3]||+x[3]===y)?+x[1]:0}
  return 0}
async function loadEv(force){
  const key=`${S.year}-${M}`;if(evFor===key&&!force)return;
  Object.keys(EV).forEach(k=>delete EV[k]);EVSTAT={rows:0,miss:0,err:'',why:''};
  try{let rows;
    if(S.script){const r=await fetch(S.script+(S.script.includes('?')?'&':'?')+`m=${S.year}-${String(M+1).padStart(2,'0')}`);const j=await r.json(),arr=Array.isArray(j)?j:j.rows;if(!arr)throw new Error(j.error||'respons Apps Script tidak valid');EVSTAT.srvTotal=j.total;EVSTAT.srvSample=j.sample;rows=arr.map(o=>[o.tanggal,o.foto,o.aktivitas,o.err,o.tampil])}
    else{const r=await fetch(`https://docs.google.com/spreadsheets/d/${sid()}/gviz/tq?tqx=out:csv&sheet=Evidence`);rows=csv(await r.text()).slice(1)}
    EVSTAT.total=rows.length;EVSTAT.sample=rows[0]?String(rows[0][0]):'';let miss=0;
    rows.forEach(r=>{const d=dayOf(r[0],+S.year,M)||dayOf(r[4],+S.year,M);if(!d)return;EVSTAT.rows++;let f=String(r[1]||'').trim().replace(/^=IMAGE\("?([^")]+)"?.*$/i,'$1');
      const dm=f.match(/drive\.google\.com\/file\/d\/([\w-]+)/);if(dm)f=`https://drive.google.com/thumbnail?id=${dm[1]}&sz=w1000`;
      if(!/^(https?:|data:image)/.test(f)){miss++;EVSTAT.miss++;if(r[3])EVSTAT.why=r[3];f=''}
      (EV[`${S.year}-${M}-${d}`]=EV[`${S.year}-${M}-${d}`]||[]).push({foto:f,akt:r[2]||''})});
    evFor=key;if(miss&&!S.script)toast(`${miss} foto evidence tidak terbaca dari link. Foto "insert image in cell" butuh Apps Script (lihat Preferences).`)
  }catch(e){evFor=null;const m=String(e.message||e);EVSTAT.err=/load failed|failed to fetch|networkerror/i.test(m)?'Apps Script tidak bisa dibaca. Kemungkinan izin belum disetujui atau script error. Buka URL Apps Script + ?m=2026-10 di tab baru untuk melihat errornya.':m}}
const sid=()=>(S.sheet.match(/\/d\/([\w-]+)/)||S.sheet.match(/^([\w-]{20,})$/)||[])[1];
function cands(m){const f=MN[m],sh=f.slice(0,3),mm=String(m+1).padStart(2,'0');
  const p=(S.tab||'{Month}').replace('{Month}',f).replace('{MONTH}',f.toUpperCase()).replace('{Mon}',sh).replace('{MM}',mm);
  return [...new Set([p,f,f.toUpperCase(),sh,sh.toUpperCase(),MI[m],`${f} ${S.year}`])]}
async function load(m,force){
  if(cache[m]&&!force)return cache[m];
  const id=sid();if(!id)throw new Error('Link Google Sheet tidak valid. Periksa di Preferences.');
  for(const tab of cands(m)){
    try{let g;
      if(S.script){const r=await fetch(S.script+(S.script.includes('?')?'&':'?')+'tab='+encodeURIComponent(tab));const j=await r.json();if(!j.grid)continue;g=j.grid}
      else{const r=await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(tab)}`);
        if(!r.ok)continue;const t=await r.text();if(/^\s*<(!doctype|html)/i.test(t))continue;g=csv(t)}
      if(new Set(g.flat().filter(x=>MN.some(n=>n.toUpperCase()===String(x).trim().toUpperCase()))).size>=3)continue; // tab Year, bukan tab bulan
      const events=extract(g);
      if(!Object.keys(events).length&&!S.script)toast('Tab terbaca tapi tidak ada aktivitas terdeteksi. Link Google sering menghilangkan sel teks di kolom campuran angka dan teks. Pakai Apps Script (Preferences) atau Impor CSV.');
      return cache[m]={events,tab}}catch(e){}}
  throw new Error(`Tab bulan ${MI[m]} tidak terbaca. Pastikan sheet dibagikan "Anyone with the link", atau atur pola nama tab di Preferences, atau impor CSV.`)}

/* ---------- weeks & slides ---------- */
function weeksOf(y,m){const last=new Date(y,m+1,0).getDate(),w=[];let cur=null;
  for(let d=1;d<=last;d++){const wd=(new Date(y,m,d).getDay()+6)%7;if(wd>4)continue;if(wd===0||!cur){cur=[];w.push(cur)}cur.push(d)}return w}
const gk=d=>`${S.year}-${M}-${d}`;
const tok=x=>String(x).toLowerCase().match(/[a-z0-9]{3,}/g)||[];
function photosFor(d,items){const per=items.map(()=>[]),extra=[];
  (EV[gk(d)]||[]).filter(p=>p.foto).forEach(p=>{const a=tok(p.akt);let best=-1,bs=0;
    items.forEach((it,i)=>{const b=tok(it.text);if(!a.length||!b.length)return;const sc=a.filter(x=>b.includes(x)).length/Math.min(a.length,b.length);if(sc>bs){bs=sc;best=i}});
    (bs>=.4?per[best]:extra).push(p.foto)});
  return{per,extra}}
function build(state){
  const wk=weeks[W]||[],ev=state.events||{},Y=+S.year,out=[],all=[];let foto=0;const lines=[];
  out.push({t:'cover',h:`Week ${W+1}`,sub:`${wk[0]} – ${wk.at(-1)} ${MI[M]} ${Y}`});
  wk.forEach(d=>{const wd=(new Date(Y,M,d).getDay()+6)%7,raw=ev[d]||[],ph=photosFor(d,raw);
    const items=raw.map((it,i)=>{const k=`${gk(d)}-${i}`,e=EDIT[k]||{};return{...it,k,n:e.n??it.n,a:e.a??it.a,ph:ph.per[i]}});
    items.forEach(i=>all.push(i));foto+=ph.extra.length+items.reduce((n,i)=>n+i.ph.length,0);
    const tokos=[...new Set(items.map(i=>i.toko).filter(Boolean))];
    const sum=items.length?`${items.length} aktivitas${tokos.length?` di ${tokos.join(', ')}`:''}, fokus pada ${items[0].cat.toLowerCase()}`:'Belum ada aktivitas tercatat';
    lines.push([DY[wd],sum]);
    const info={day:DY[wd],date:`${d} ${MI[M]} ${Y}`,bulan:MI[M],week:W+1,tokos,sum};
    const chunks=items.length?Array.from({length:Math.ceil(items.length/3)},(_,c)=>items.slice(c*3,c*3+3)):[[]];
    chunks.forEach((ch,c)=>out.push({t:'day',...info,items:ch,page:c+1,pages:chunks.length,extra:c===chunks.length-1?ph.extra:[]}))});
  const evp=[];wk.forEach(d=>{const wd=(new Date(Y,M,d).getDay()+6)%7;(EV[gk(d)]||[]).filter(p=>p.foto).forEach(p=>evp.push({day:DY[wd],date:`${d} ${MI[M].slice(0,3)}`,akt:p.akt,foto:p.foto}))});
  const msg=EVSTAT.err?`Tab Evidence tidak terbaca: ${EVSTAT.err}`:EVSTAT.rows?`${EVSTAT.rows} baris Evidence ditemukan di bulan ini, tetapi foto untuk week ini tidak ada atau tidak terbaca${EVSTAT.why?` (${EVSTAT.why})`:''}. Pasang atau deploy ulang Apps Script di Preferences.`:(EVSTAT.total?`Tab Evidence berisi ${EVSTAT.total} baris, tetapi tanggalnya (contoh: ${EVSTAT.sample}) tidak cocok dengan ${MI[M]} ${Y}.`:EVSTAT.srvTotal!=null?`Apps Script membaca ${EVSTAT.srvTotal} baris di tab Evidence, tetapi tidak ada yang cocok dengan ${MI[M]} ${Y}. Baris pertama: ${EVSTAT.srvSample||'-'}.`:'Tidak ada baris Evidence yang diterima. Pastikan Apps Script sudah di-deploy ulang dengan versi terbaru.');
  const epg=Math.max(1,Math.ceil(evp.length/6));for(let c=0;c<epg;c++)out.push({t:'ev',page:c+1,pages:epg,ph:evp.slice(c*6,c*6+6),msg});
  const tokos=[...new Set(all.map(i=>i.toko).filter(Boolean))],cc={};all.forEach(i=>cc[i.cat]=(cc[i.cat]||0)+1);
  const cats=Object.entries(cc).sort((a,b)=>b[1]-a[1]),act=lines.filter(l=>!l[1].startsWith('Belum')).length;
  const kend=all.filter(i=>i.n).length,aksi=all.filter(i=>i.a).length;
  const text=all.length?`Pada Week ${W+1} (${wk[0]}–${wk.at(-1)} ${MI[M]} ${Y}) tercatat ${all.length} aktivitas di ${act} dari ${wk.length} hari kerja.`
    +(tokos.length?` Toko yang dikunjungi: ${tokos.join(', ')}.`:'')+(cats.length?` Fokus utama: ${cats.slice(0,3).map(c=>`${c[0]} (${c[1]})`).join(', ')}.`:'')
    +(kend||aksi?` Terdapat ${kend} catatan/kendala dan ${aksi} action plan.`:' Belum ada catatan kendala atau action plan.')+(foto?` ${foto} foto evidence terlampir.`:''):'Belum ada aktivitas yang tercatat di kalender untuk week ini.';
  out.push({t:'sum',total:all.length,act,days:wk.length,tokos,cats,foto,text,lines});return out}
const phHTML=a=>(a||[]).map(u=>`<img class="pi" src="${esc(u)}" alt="Foto evidence" loading="lazy">`).join('');
function slideHTML(s){
  if(s.t==='cover')return `<section class="slide cover"><h1>${esc(s.h)}</h1><p>${esc(s.sub)}</p><div class="who"><b>${esc(S.name)}</b><span>${esc(S.title)}</span></div></section>`;
  if(s.t==='day')return `<section class="slide day"><div class="l"><h2>${s.day}</h2><div class="d">${s.date}${s.pages>1?`, bagian ${s.page}/${s.pages}`:''}</div><div class="m"><span>${s.bulan}</span><span>Week ${s.week}</span></div>${s.tokos.length?`<div class="s">Toko: ${esc(s.tokos.join(', '))}</div>`:''}<div class="s">${esc(s.sum)}</div></div>
    <div class="items">${s.items.length?s.items.map(i=>`<div class="it"><div><span class="cat">${esc(i.cat)}</span></div><div class="ph">${phHTML(i.ph)}</div><div class="t">${esc(i.text)}</div><div class="f"><div><label>Catatan / Kendala</label><p contenteditable data-k="${i.k}" data-f="n" data-ph="Ketuk untuk isi">${esc(i.n)}</p></div><div><label>Action Plan / Tindak Lanjut</label><p contenteditable data-k="${i.k}" data-f="a" data-ph="Ketuk untuk isi">${esc(i.a)}</p></div></div></div>`).join(''):'<div class="empty">Belum ada aktivitas di kalender</div>'}${s.extra.length?`<div class="ex">Foto evidence lainnya<div class="ph">${phHTML(s.extra)}</div></div>`:''}</div></section>`;
  if(s.t==='ev')return `<section class="slide evs"><h2>Foto Evidence${s.pages>1?`, bagian ${s.page}/${s.pages}`:''}</h2>${s.ph.length?`<div class="gal">${s.ph.map(p=>`<figure><img class="pi gi" src="${esc(p.foto)}" alt="Foto evidence" loading="lazy"><figcaption><b>${p.day}, ${p.date}</b>${esc(p.akt)}</figcaption></figure>`).join('')}</div>`:`<div class="msg">${esc(s.msg)}</div>`}</section>`;
  if(s.t==='sum')return `<section class="slide sum"><h2>Summary ${esc('Week '+(W+1))}</h2><div class="stats"><div><b>${s.total}</b>aktivitas</div><div><b>${s.act}/${s.days}</b>hari terisi</div><div><b>${s.tokos.length}</b>toko</div><div><b>${s.foto}</b>foto evidence</div></div><p class="nar">${esc(s.text)}</p><div class="cats">${s.cats.map(c=>`<span class="cat">${esc(c[0])} ${c[1]}</span>`).join('')}</div><div class="sl">${s.lines.map(l=>`<p><b>${l[0]}</b>${esc(l[1])}</p>`).join('')}</div></section>`;
  return `<section class="slide"><div class="msg">${esc(s.m)}</div></section>`}
function render(){
  $('#stage').innerHTML=slides.map(slideHTML).join('');
  $('#dots').innerHTML=slides.map(()=>'<i></i>').join('');
  I=Math.min(I,slides.length-1);go(I)}
function go(i){I=Math.max(0,Math.min(slides.length-1,i));
  if(dirty&&cache[M]&&slides[I]?.t==='sum'){dirty=false;slides=build(cache[M]);$('#stage').innerHTML=slides.map(slideHTML).join('')}
  document.querySelectorAll('.slide').forEach((e,k)=>{e.classList.toggle('on',k===I);e.classList.toggle('before',k<I)});
  document.querySelectorAll('.dots i').forEach((e,k)=>e.classList.toggle('on',k===I));
  $('#prev').disabled=I===0;$('#next').disabled=I>=slides.length-1}

/* ---------- navigation ---------- */
function drawWeeks(){$('#weeks').innerHTML=weeks.map((_,k)=>`<button role="tab" class="${k===W?'on':''}" data-k="${k}">Week ${k+1}</button>`).join('')}
async function show(force){
  weeks=weeksOf(+S.year,M);if(W>=weeks.length)W=0;drawWeeks();I=0;
  slides=[{t:'msg',m:'Memuat data kalender…'}];render();
  try{const st=await load(M,force);await loadEv(force);slides=build(st)}catch(e){slides=[{t:'msg',m:e.message}]}
  render()}
function pickWeek(k){W=k;drawWeeks();if(cache[M]){slides=build(cache[M]);I=0;render()}else show()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3800)}
function menu(o){document.body.classList.toggle('open',o);$('#menu').setAttribute('aria-expanded',o);$('#menu').setAttribute('aria-label',o?'Tutup menu':'Buka menu')}

/* ---------- export ---------- */
/* library export dimuat saat dibutuhkan, dengan 3 sumber cadangan */
function loadLib(){return window.PptxGenJS?Promise.resolve():new Promise((ok,no)=>{
  const u=['https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js','https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js','https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js'];let i=0;
  (function t(){if(window.PptxGenJS)return ok();if(i>=u.length)return no(new Error('gagal'));const e=document.createElement('script');e.src=u[i++];e.onload=()=>window.PptxGenJS?ok():t();e.onerror=()=>{e.remove();t()};document.head.appendChild(e)})()})}
async function exportDeck(key){
  toast('Menyiapkan file export…');
  try{await loadLib()}catch(e){return toast('Library export gagal dimuat dari 3 sumber. Matikan content blocker atau VPN, lalu muat ulang halaman dan coba lagi.')}
  if(!cache[M])return toast('Belum ada data untuk diexport.');
  slides=build(cache[M]);
  const p=new PptxGenJS();p.layout='LAYOUT_16x9';const BG='0B1230',FG='FFFFFF',MU='A9B4D6',AC='4DA3FF';
  slides.forEach(s=>{const sl=p.addSlide();sl.background={color:BG};
    if(s.t==='cover'){sl.addText(s.h,{x:.7,y:1.3,w:8.6,h:1.5,fontSize:64,bold:true,color:FG});
      sl.addText(s.sub,{x:.7,y:2.8,w:8.6,h:.6,fontSize:24,color:MU});
      sl.addText([{text:S.name,options:{bold:true,fontSize:22,color:FG,breakLine:true}},{text:S.title,options:{fontSize:16,color:MU}}],{x:.7,y:4.3,w:8.6,h:.9})}
    if(s.t==='day'){
      sl.addText(`${s.day}, ${s.date}`,{x:.5,y:.3,w:9,h:.6,fontSize:30,bold:true,color:FG});
      sl.addText(`${s.bulan} | Week ${s.week} | Toko: ${s.tokos.join(', ')||'-'}${s.pages>1?` | Bagian ${s.page}/${s.pages}`:''}`,{x:.5,y:.9,w:9,h:.35,fontSize:13,color:MU});
      const hd=['Kategori','Detail Aktivitas','Catatan / Kendala','Action Plan'].map(t=>({text:t,options:{bold:true,color:AC,fill:{color:'16204A'}}}));
      const rows=s.items.length?s.items.map(i=>[i.cat,i.text,i.n||'-',i.a||'-'].map(t=>({text:t,options:{color:FG}}))):[[{text:'Belum ada aktivitas',options:{color:MU,colspan:4}}]];
      sl.addTable([hd,...rows],{x:.5,y:1.4,w:6.2,colW:[1.1,2.2,1.5,1.4],fontSize:11,border:{type:'solid',pt:.5,color:'33406E'},valign:'top'});
      [...s.items.flatMap(i=>i.ph||[]),...s.extra].slice(0,6).forEach((src,n)=>{
        const o={x:6.95+(n%2)*1.5,y:1.4+Math.floor(n/2)*1.25,w:1.4,h:1.15,sizing:{type:'cover',w:1.4,h:1.15}};
        if(src.startsWith('data:'))o.data=src.slice(5);else o.path=src;try{sl.addImage(o)}catch(e){}})}
    if(s.t==='ev'){sl.addText('Foto Evidence'+(s.pages>1?` (${s.page}/${s.pages})`:''),{x:.5,y:.25,w:9,h:.6,fontSize:28,bold:true,color:FG});
      s.ph.forEach((p,n)=>{const x=.5+(n%3)*3.05,y=1+Math.floor(n/3)*2.2,o={x,y,w:2.9,h:1.6,sizing:{type:'cover',w:2.9,h:1.6}};
        if(p.foto.startsWith('data:'))o.data=p.foto.slice(5);else o.path=p.foto;try{sl.addImage(o)}catch(e){}
        sl.addText(`${p.day}, ${p.date}: ${p.akt}`,{x,y:y+1.62,w:2.9,h:.5,fontSize:10,color:MU,valign:'top'})});
      if(!s.ph.length)sl.addText(s.msg,{x:.5,y:2,w:9,h:1.2,fontSize:16,color:MU})}
    if(s.t==='sum'){sl.addText(`Summary Week ${W+1}`,{x:.6,y:.4,w:8.8,h:.8,fontSize:36,bold:true,color:FG});
      sl.addText(`${s.total} aktivitas | ${s.act}/${s.days} hari terisi | ${s.tokos.length} toko | ${s.foto} foto`,{x:.6,y:1.2,w:8.8,h:.4,fontSize:16,color:AC});
      sl.addText(s.text,{x:.6,y:1.8,w:8.8,h:1.4,fontSize:16,color:FG,valign:'top'});
      sl.addText(s.lines.map(l=>({text:`${l[0]}: ${l[1]}`,options:{breakLine:true}})),{x:.6,y:3.3,w:8.8,h:2,fontSize:13,color:MU,valign:'top',paraSpaceAfter:4})}});
  await p.writeFile({fileName:`Week-${W+1}-${MN[M]}-${S.year}.pptx`});
  toast(key?'Keynote membuka file .pptx. Buka di Keynote, lalu File > Simpan untuk jadi .key.':'File .pptx berhasil dibuat.')}

/* ---------- init ---------- */
function init(){
  $('#month').innerHTML=MI.map((m,k)=>`<option value="${k}">${m}</option>`).join('');$('#month').value=M;
  const set=(id,k)=>{const e=$(id);e.value=S[k];e.addEventListener('input',()=>{S[k]=e.value;save();$('#who').textContent=`${S.name}, ${S.title}`;if(k==='name'||k==='title')render()})};
  set('#pName','name');set('#pTitle','title');set('#pSheet','sheet');set('#pYear','year');set('#pTab','tab');set('#pScript','script');
  $('#who').textContent=`${S.name}, ${S.title}`;
  document.querySelectorAll('#theme button').forEach(b=>b.onclick=()=>{S.theme=b.dataset.v;save();applyTheme()});
  $('#menu').onclick=()=>menu(!document.body.classList.contains('open'));$('#scrim').onclick=()=>menu(false);
  $('#month').onchange=e=>{M=+e.target.value;W=0;show()};
  $('#weeks').onclick=e=>{const b=e.target.closest('button');if(b)pickWeek(+b.dataset.k)};
  $('#prev').onclick=()=>go(I-1);$('#next').onclick=()=>go(I+1);
  $('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
  $('#reload').onclick=()=>{cache={};evFor=null;menu(false);show(true)};
  $('#exPptx').onclick=()=>exportDeck(false);$('#exKey').onclick=()=>exportDeck(true);
  $('#csvIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;cache[M]={events:extract(csv(await f.text())),tab:'csv'};menu(false);slides=build(cache[M]);I=0;render();e.target.value=''};
  addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.target.isContentEditable)return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(I+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp')go(I-1);
    else if(e.key==='Escape')menu(false);else if(e.key==='f')$('#fs').click()});
  let x0=null;const st=$('#stage');
  st.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
  st.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)go(I+(dx<0?1:-1));x0=null});
  $('#stage').addEventListener('focusout',e=>{const el=e.target.closest('[data-k]');if(!el)return;const k=el.dataset.k;(EDIT[k]=EDIT[k]||{})[el.dataset.f]=el.textContent.trim();dirty=true;try{localStorage.setItem('wp-edits',JSON.stringify(EDIT))}catch(x){}});
  $('#stage').addEventListener('click',e=>{if(e.target.classList.contains('pi')){$('#lb img').src=e.target.src;$('#lb').classList.add('on')}});
  $('#lb').onclick=()=>$('#lb').classList.remove('on');
  applyTheme();loadLib().catch(()=>{});
  weeks=weeksOf(+S.year,M);const t=now.getDate();W=Math.max(0,weeks.findIndex(w=>w.includes(t)||w[0]>t));if(W<0)W=0;
  show()}
init();
</script>
